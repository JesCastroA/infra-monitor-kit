name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: docker build --target test -t infra-monitor-test:latest .

      - name: Run unit tests inside container
        run: docker run --rm infra-monitor-test:latest

      - name: Build production image for scanning
        run: docker build --target production -t infra-monitor-kit:scan .

  quality-and-security:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production image for scanning
        run: docker build --target production -t infra-monitor-kit:scan .

      - name: Run Snyk open source and code scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npx snyk auth "$SNYK_TOKEN"
          npx snyk test --severity-threshold=high || true
          npx snyk code test --severity-threshold=high || true

      - name: Run SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ea12c323daa9131828d844d6edd4869ba7f49345
            -Dsonar.organization=jescastroa
            -Dsonar.sources=src

      - name: Run Docker Scout CVE check
        uses: docker/scout-action@v1
        with:
          command: cves
          image: infra-monitor-kit:scan
          dockerhub-user: ${{ secrets.DOCKERHUB_USER }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          only-severities: critical,high
          exit-code: false

  codeql:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  publish:
    runs-on: ubuntu-latest
    needs: [build-and-test, quality-and-security, codeql]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        run: |
          REPO_LOWER=$(echo "${{ secrets.DOCKERHUB_USER }}/infra-monitor-kit" | tr '[:upper:]' '[:lower:]')
          docker build --target production -t "$REPO_LOWER:develop" -t "$REPO_LOWER:latest" .
          docker push "$REPO_LOWER:develop"
          docker push "$REPO_LOWER:latest"