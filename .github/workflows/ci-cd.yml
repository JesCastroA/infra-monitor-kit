name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: docker build --target test -t infra-monitor-test:latest .

      - name: Run unit tests inside container
        run: docker run --rm infra-monitor-test:latest

  publish:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        run: |
          docker build --target production -t ${{ secrets.DOCKERHUB_USER }}/infra-monitor-kit:develop -t ${{ secrets.DOCKERHUB_USER }}/infra-monitor-kit:latest .
          docker push ${{ secrets.DOCKERHUB_USER }}/infra-monitor-kit:develop
          docker push ${{ secrets.DOCKERHUB_USER }}/infra-monitor-kit:latest
